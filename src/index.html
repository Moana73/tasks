<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tasks" />
    <meta name="format-detection" content="telephone=no" />
    <title>Tasks</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="modulepreload" href="%APP_JS%" />
    <style>/*__INLINE_CSS__*/</style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

    <!--
      起動直後（JS 読み込み前）から表示される全画面スケルトン。
      入力欄だけは本物なので、JS が届く前に打ち始めた文字も React 側へ引き継がれる。
    -->
    <div id="boot" class="app" data-testid="boot">
      <header class="top">
        <div class="bar">
          <div class="tabs glass" data-testid="skeleton-tabs">
            <i class="sk sk-tab"></i><i class="sk sk-tab"></i><i class="sk sk-tab"></i><i class="sk sk-tab"></i>
          </div>
          <div class="avatar glass"><i class="sk" style="width: 100%; height: 100%; border-radius: 50%"></i></div>
        </div>
        <label class="composer glass">
          <textarea id="boot-input" class="composer-input" rows="1" placeholder="メモ" aria-label="メモ" enterkeyhint="send" autofocus></textarea>
        </label>
      </header>
      <main class="list" data-testid="skeleton">
        <div class="sk-row glass"><i class="sk sk-dot"></i><div class="sk-lines"><i class="sk sk-line" style="width: 72%"></i><i class="sk sk-line" style="width: 28%"></i></div></div>
        <div class="sk-row glass"><i class="sk sk-dot"></i><div class="sk-lines"><i class="sk sk-line" style="width: 54%"></i><i class="sk sk-line" style="width: 22%"></i></div></div>
        <div class="sk-row glass"><i class="sk sk-dot"></i><div class="sk-lines"><i class="sk sk-line" style="width: 84%"></i><i class="sk sk-line" style="width: 30%"></i></div></div>
        <div class="sk-row glass"><i class="sk sk-dot"></i><div class="sk-lines"><i class="sk sk-line" style="width: 46%"></i><i class="sk sk-line" style="width: 24%"></i></div></div>
        <div class="sk-row glass"><i class="sk sk-dot"></i><div class="sk-lines"><i class="sk sk-line" style="width: 66%"></i><i class="sk sk-line" style="width: 26%"></i></div></div>
        <div class="sk-row glass"><i class="sk sk-dot"></i><div class="sk-lines"><i class="sk sk-line" style="width: 58%"></i><i class="sk sk-line" style="width: 20%"></i></div></div>
      </main>
    </div>

    <div id="root"></div>
    <script>
      // JS 本体の到着前に打った文字を失わないよう、入力欄はこの時点で使える
      document.getElementById('boot-input').addEventListener('input', function (e) {
        e.target.style.height = 'auto';
        e.target.style.height = Math.min(e.target.scrollHeight, 168) + 'px';
      });
    </script>
    <script type="module" src="%APP_JS%"></script>
  </body>
</html>
